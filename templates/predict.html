{% extends "base.html" %}{% block title %}Predict churn · ChurnIQ{% endblock %}{% block content %}<section class="page-heading"><div><p class="eyebrow">MACHINE LEARNING TOOL</p><h1>Customer <span>prediction.</span></h1><p>Enter customer details to estimate churn probability.</p></div></section><form class="panel prediction-form" method="post"><h2>Customer profile</h2><p>Complete the profile to get a prediction from the trained model.</p><div class="form-grid"><label>Gender<select name="gender"><option>Female</option><option>Male</option></select></label><label>Senior citizen<select name="SeniorCitizen"><option value="0">No</option><option value="1">Yes</option></select></label><label>Partner<select name="Partner"><option>No</option><option>Yes</option></select></label><label>Dependents<select name="Dependents"><option>No</option><option>Yes</option></select></label><label>Tenure (months)<input type="number" name="tenure" min="0" max="72" value="12" required></label><label>Phone service<select name="PhoneService"><option>Yes</option><option>No</option></select></label><label>Multiple lines<select name="MultipleLines"><option>No</option><option>Yes</option><option>No phone service</option></select></label><label>Internet service<select name="InternetService"><option>Fiber optic</option><option>DSL</option><option>No</option></select></label><label>Online security<select name="OnlineSecurity"><option>No</option><option>Yes</option><option>No internet service</option></select></label><label>Online backup<select name="OnlineBackup"><option>No</option><option>Yes</option><option>No internet service</option></select></label><label>Device protection<select name="DeviceProtection"><option>No</option><option>Yes</option><option>No internet service</option></select></label><label>Tech support<select name="TechSupport"><option>No</option><option>Yes</option><option>No internet service</option></select></label><label>Streaming TV<select name="StreamingTV"><option>No</option><option>Yes</option><option>No internet service</option></select></label><label>Streaming movies<select name="StreamingMovies"><option>No</option><option>Yes</option><option>No internet service</option></select></label><label>Contract<select name="Contract"><option>Month-to-month</option><option>One year</option><option>Two year</option></select></label><label>Paperless billing<select name="PaperlessBilling"><option>Yes</option><option>No</option></select></label><label>Payment method<select name="PaymentMethod"><option>Electronic check</option><option>Mailed check</option><option>Bank transfer (automatic)</option><option>Credit card (automatic)</option></select></label><label>Monthly charges<input type="number" step=".01" min="0" name="MonthlyCharges" value="70" required></label><label>Total charges<input type="number" step=".01" min="0" name="TotalCharges" value="840" required></label></div><button class="button button-primary submit-button" type="submit">Predict churn probability →</button></form>{% endblock %}
